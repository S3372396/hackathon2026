# Local TideCloak for the show-approval prototype (Stage 0).
# Same image and settings as Tide's getting-started guide
# (github.com/tide-foundation/tidecloak-gettingstarted), but the admin password comes from .env.
#
#   docker compose up -d        # start
#   docker compose logs -f      # follow logs
#
# Realm setup (roles, users, licence, IGA) is done by tidecloak/setup.sh, not by this file.
services:
  tidecloak:
    image: tideorg/tidecloak-dev:latest
    container_name: tidecloak
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
    volumes:
      # H2 database, so the realm survives container restarts. Gitignored.
      - ./tidecloak/data:/opt/keycloak/data/h2
